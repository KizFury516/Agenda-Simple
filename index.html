<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Agenda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">

    <header>
      <div class="brand">
        <h1>Agenda</h1>
        <p id="subtitle">Tus próximos días</p>
      </div>

      <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg>
      </button>
    </header>

    <div class="filters">
      <button class="filter-btn active" data-filter="todo">Todo</button>
      <button class="filter-btn" data-filter="evento">Eventos</button>
      <button class="filter-btn" data-filter="entrega">Entregas</button>
    </div>

    <main id="list"></main>

    <button class="fab" id="addBtn" aria-label="Añadir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>

    <!-- Sheet: añadir / editar -->
    <div class="sheet-overlay" id="editOverlay">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <h2 id="sheetTitle">Nuevo elemento</h2>

        <div class="type-switch">
          <button type="button" id="typeEvento" class="active evento">Evento</button>
          <button type="button" id="typeEntrega" class="entrega">Entrega</button>
        </div>

        <div class="field">
          <label id="labelTitulo" for="inpTitulo">Título</label>
          <input type="text" id="inpTitulo" placeholder="Ej. Reunión con tutor">
          <p class="field-error" id="errorTitulo">Este campo es obligatorio</p>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="inpFecha">Fecha</label>
            <input type="date" id="inpFecha">
            <p class="field-error" id="errorFecha">Este campo es obligatorio</p>
          </div>

          <div class="field">
            <label for="inpHora">Hora</label>
            <input type="time" id="inpHora">
          </div>
        </div>

        <button type="button" class="optional-toggle-btn" id="optionalToggleBtn">
          <span id="optionalToggleLabel">Añadir detalles opcionales</span>
          <svg id="optionalToggleIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>

        <div class="optional-content" id="optionalContent">
          <div class="field" id="fieldAsignatura" style="display:none;">
            <label for="inpAsignatura">Asignatura</label>
            <input type="text" id="inpAsignatura" placeholder="Ej. Cálculo II">
          </div>

          <div class="field" id="fieldLugar">
            <label for="inpLugar">Lugar</label>
            <input type="text" id="inpLugar" placeholder="Ej. Biblioteca">
          </div>
        </div>

        <div class="sheet-actions">
          <button class="btn btn-secondary" id="cancelBtn">Cancelar</button>
          <button class="btn btn-primary" id="saveBtn">Guardar</button>
        </div>
      </div>
    </div>

    <!-- Sheet: detalle -->
    <div class="sheet-overlay" id="detailOverlay">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <h2 id="detailTitle">Título</h2>

        <div class="field">
          <label>Detalles</label>
          <div id="detailBody" class="detail-body"></div>
        </div>

        <div class="detail-actions">
          <button class="btn btn-secondary" id="detailEditBtn">Editar</button>
          <button class="btn btn-primary" id="detailDoneBtn">Marcar entregado</button>
        </div>

        <div class="sheet-actions">
          <button class="btn btn-danger" id="detailDeleteBtn">Eliminar</button>
        </div>
      </div>
    </div>

  </div>

  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/agenda.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
